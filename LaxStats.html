<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LaxTracker Pro - Final Layout</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --our-team-color: #34c759;
            --opponent-color: #ff3b30;
            --blue: #007aff;
            --orange: #ff9500;
            --purple: #af52de;
            --teal: #30b0c7;
            --card-color: #ffcc00;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden; 
            padding-top: env(safe-area-inset-top);
        }

        #game-identifier-bar {
            background-color: #1c1c1e;
            padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
        }
        #game-id-input {
            flex-grow: 1; background: #2c2c2e; border: 1px solid #444;
            color: white; padding: 6px 10px; border-radius: 6px; font-size: 14px;
        }
        .game-label { color: #8e8e93; font-size: 10px; font-weight: bold; text-transform: uppercase; }

        #scoreboard {
            background-color: var(--card-bg);
            padding: 5px; border-bottom: 1px solid #ccc; flex-shrink: 0;
        }

        .score-row {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 4px; 
        }

        .score-item { text-align: center; padding: 4px 0; border-right: 1px solid #eee; }
        .score-item:last-child { border-right: none; }

        .score-val { font-size: 16px; font-weight: bold; display: block; line-height: 1.1; }
        .score-label { font-size: 8px; color: #666; font-weight: bold; text-transform: uppercase; }
        .team-our { color: var(--our-team-color); }
        .team-opp { color: var(--opponent-color); }
        .score-sep { color: #ccc; font-weight: normal; margin: 0 2px; }

        /* The Main Action area is fixed height */
        #action-area { flex-shrink: 0; padding: 8px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .grid-extended { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }

        button.stat-btn {
            border: none; color: white; padding: 12px; font-size: 14px; 
            font-weight: 800; border-radius: 10px; text-transform: uppercase;
            touch-action: manipulation;
        }
        button.stat-btn:active { opacity: 0.7; transform: scale(0.98); }

        .btn-goal { background-color: var(--our-team-color); }
        .btn-missed { background-color: var(--blue); } 
        .btn-assist { background-color: var(--teal); }
        .btn-save { background-color: #00aaff; }
        .btn-draw { background-color: var(--purple); }
        .btn-to-our { background-color: #ff6347; }
        .btn-to-opp { background-color: #cc3333; }
        .btn-card { background-color: var(--card-color); color: #333 !important; } 
        .btn-note { background-color: #8e8e93; } 
        .btn-utility { padding: 10px; font-size: 12px; } 

        .tracker-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;
        }

        .tracker-box {
            background-color: var(--card-bg); padding: 8px; border-radius: 8px;
            text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .tracker-label { font-size: 8px; color: #666; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; }
        .tracker-details { font-size: 13px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        #timer-container {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--card-bg); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; 
        }
        #game-timer { font-size: 24px; font-weight: 900; }
        .timer-running { color: var(--opponent-color); }
        .timer-paused { color: var(--blue); }

        #timer-toggle-btn {
            background-color: var(--our-team-color); color: white; border: none; 
            padding: 8px 16px; border-radius: 8px; font-weight: bold;
        }
        #timer-toggle-btn.pause { background-color: var(--orange); }

        /* This container fills the rest of the screen */
        #history-wrapper {
            flex-grow: 1;
            background-color: var(--card-bg);
            border-top: 1px solid #ccc;
            overflow-y: auto;
            position: relative;
        }

        .history-item { padding: 8px 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: flex-end; z-index: 100;
        }
        #team-modal-container, #to-modal-container, #numpad-container {
            background: white; width: 100%; border-radius: 20px 20px 0 0;
            padding: 20px; box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
        }
        .team-choice-grid { display: flex; gap: 20px; margin: 20px 0; }
        .team-choice-btn { flex: 1; padding: 30px 10px; font-size: 18px; font-weight: bold; border-radius: 12px; border: none; color: white; }
        .team-our-btn { background-color: var(--our-team-color); }
        .team-opp-btn { background-color: var(--opponent-color); }
        
        #numpad-display { font-size: 36px; font-weight: bold; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .numpad-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .num-btn { background: #e5e5ea; border: none; padding: 20px; font-size: 24px; border-radius: 12px; }
        .num-btn.ok { background-color: var(--our-team-color); color: white; }
    </style>
</head>
<body>

    <div id="game-identifier-bar">
        <span class="game-label">Game:</span>
        <input type="text" id="game-id-input" placeholder="Game Name" onchange="switchGameContext()">
        <button onclick="clearAllData()" style="background:none; border:none; color:#ff3b30; font-size:10px; font-weight:bold;">CLEAR ALL</button>
    </div>

    <div id="scoreboard">
        <div class="score-row">
            <div class="score-item">
                <span class="score-val"><span class="team-our" id="score-our-goals">0</span><span class="score-sep">|</span><span class="team-opp" id="score-opp-goals">0</span></span>
                <span class="score-label">Goals</span>
            </div>
            <div class="score-item">
                <span class="score-val"><span class="team-our" id="score-our-shots">0</span><span class="score-sep">|</span><span class="team-opp" id="score-opp-shots">0</span></span>
                <span class="score-label">Total Shots</span>
            </div>
            <div class="score-item">
                <span class="score-val"><span class="team-our" id="score-our-saves">0</span><span class="score-sep">|</span><span class="team-opp" id="score-opp-saves">0</span></span>
                <span class="score-label">Saves</span>
            </div>
        </div>
        <div class="score-row">
            <div class="score-item">
                <span class="score-val"><span class="team-our" id="score-our-draws">0</span><span class="score-sep">|</span><span class="team-opp" id="score-opp-draws">0</span></span>
                <span class="score-label">Draws</span>
            </div>
            <div class="score-item">
                <span class="score-val"><span class="team-our" id="score-our-to">0</span><span class="score-sep">|</span><span class="team-opp" id="score-opp-to">0</span></span>
                <span class="score-label">Turnovers</span>
            </div>
            <div class="score-item">
                <span class="score-val"><span class="team-our" id="score-our-missed">0</span><span class="score-sep">|</span><span class="team-opp" id="score-opp-missed">0</span></span>
                <span class="score-label">Missed Shots</span>
            </div>
        </div>
    </div>

    <div id="action-area">
        <div class="grid">
            <button class="stat-btn btn-goal" onclick="handleStatClick('Goal')">Goal</button>
            <button class="stat-btn btn-missed" onclick="handleStatClick('Missed Shot')">Missed</button>
            <button class="stat-btn btn-assist" onclick="handleStatClick('Assist')">Assist</button>
            <button class="stat-btn btn-save" onclick="handleStatClick('Save')">Save</button>
            <button class="stat-btn btn-draw" onclick="handleStatClick('Draw')">Draw Ctrl</button>
            <button class="stat-btn btn-note" onclick="handleNoteClick()">Note</button>
        </div>
        
        <div class="grid">
            <button class="stat-btn btn-to-our" onclick="handleTOClick('Our')">Our TO</button>
            <button class="stat-btn btn-to-opp" onclick="handleTOClick('Opponent')">Opp TO</button>
        </div>

        <div class="grid-extended">
            <button class="stat-btn btn-card" onclick="handleStatClick('Yellow Card')">Y-Card</button>
            <button class="stat-btn btn-utility" style="background-color: var(--teal);" onclick="exportResults()">Export & Copy</button>
            <button class="stat-btn btn-utility" style="background-color: #555;" id="half-tracker-btn" onclick="switchHalf()">H1/H2</button>
        </div>
        
        <div id="timer-container">
            <div id="game-timer" class="timer-paused">20:00</div>
            <div id="timer-controls">
                <button id="timer-toggle-btn" onclick="toggleTimer()">START</button>
                <button onclick="setTimerDuration()" style="border:none; background:none; color:var(--blue); font-size:10px; margin-left:10px;">SET</button>
            </div>
        </div>

        <div class="tracker-row">
            <div class="tracker-box">
                <div class="tracker-label">Top Scorer (Our)</div>
                <div class="tracker-details team-our" id="our-top-scorer">--</div>
            </div>
            <div class="tracker-box">
                <div class="tracker-label">Top Scorer (Opp)</div>
                <div class="tracker-details team-opp" id="opp-top-scorer">--</div>
            </div>
        </div>
        <div class="tracker-row">
            <div class="tracker-box">
                <div class="tracker-label">Yellow Cards (Our)</div>
                <div class="tracker-details" style="color:var(--card-color); text-shadow:0.5px 0.5px 0 #000;" id="our-cards">--</div>
            </div>
            <div class="tracker-box">
                <div class="tracker-label">Yellow Cards (Opp)</div>
                <div class="tracker-details" style="color:var(--card-color); text-shadow:0.5px 0.5px 0 #000;" id="opp-cards">--</div>
            </div>
        </div>
    </div>

    <div id="history-wrapper">
        <div id="history-container"></div>
    </div>

    <div id="team-modal-overlay" class="modal-overlay">
        <div id="team-modal-container">
            <div id="team-modal-title" style="text-align:center; font-weight:bold;">Which Team?</div>
            <div class="team-choice-grid">
                <button class="team-choice-btn team-our-btn" onclick="selectTeam('Our')">Our Team</button>
                <button class="team-choice-btn team-opp-btn" onclick="selectTeam('Opponent')">Opponent</button>
            </div>
            <button onclick="closeModal('team')" style="width:100%; padding:15px; border:none; background:none; color:var(--blue); font-weight:bold;">Cancel</button>
        </div>
    </div>

    <div id="to-modal-overlay" class="modal-overlay">
        <div id="to-modal-container">
            <div style="text-align:center; font-weight:bold;">Turnover Type</div>
            <div class="team-choice-grid">
                <button class="team-choice-btn" style="background:var(--teal);" onclick="classifyTurnover('Forced')">Forced</button>
                <button class="team-choice-btn" style="background:var(--orange);" onclick="classifyTurnover('Unforced')">Unforced</button>
            </div>
            <button onclick="closeModal('to')" style="width:100%; padding:15px; border:none; background:none; color:var(--blue); font-weight:bold;">Cancel</button>
        </div>
    </div>

    <div id="numpad-modal-overlay" class="modal-overlay">
        <div id="numpad-container">
            <div id="numpad-display">_</div>
            <div class="numpad-grid">
                <button class="num-btn" onclick="numInput('1')">1</button><button class="num-btn" onclick="numInput('2')">2</button><button class="num-btn" onclick="numInput('3')">3</button>
                <button class="num-btn" onclick="numInput('4')">4</button><button class="num-btn" onclick="numInput('5')">5</button><button class="num-btn" onclick="numInput('6')">6</button>
                <button class="num-btn" onclick="numInput('7')">7</button><button class="num-btn" onclick="numInput('8')">8</button><button class="num-btn" onclick="numInput('9')">9</button>
                <button class="num-btn" style="background:#8e8e93; color:white;" onclick="numInput('?')">?</button> 
                <button class="num-btn" onclick="numInput('0')">0</button>
                <button class="num-btn ok" onclick="submitNum()">OK</button>
            </div>
            <button onclick="closeModal('numpad')" style="width:100%; margin-top:15px; border:none; background:none; color:var(--blue);">Cancel</button>
        </div>
    </div>

    <script>
        let currentGameID = "Default";
        let events = [];
        let currentHalf = 1; 
        let currentDurationMinutes = 20; 
        let timeLeftSeconds = 1200;
        let timerInterval = null;
        let currentRunStartTime = 0;
        let pendingStat = { type: null, team: null, requiresNumber: false };
        let currentNumber = "";

        const STATS_REQUIRING_NUM = ['Goal', 'Missed Shot', 'Assist', 'Yellow Card', 'Save'];

        window.onload = function() {
            const lastActive = localStorage.getItem('lastActiveGame');
            if(lastActive) {
                currentGameID = lastActive;
                document.getElementById('game-id-input').value = currentGameID;
            }
            loadGameData();
        };

        function switchGameContext() {
            const input = document.getElementById('game-id-input').value.trim();
            if(!input) return;
            stopTimerEngine(); 
            currentGameID = input;
            localStorage.setItem('lastActiveGame', currentGameID);
            loadGameData();
        }

        function loadGameData() {
            const savedEvents = localStorage.getItem(`laxEvents_${currentGameID}`);
            events = savedEvents ? JSON.parse(savedEvents) : [];
            const savedHalf = localStorage.getItem(`half_${currentGameID}`);
            currentHalf = savedHalf ? parseInt(savedHalf) : 1;
            const savedDur = localStorage.getItem(`dur_${currentGameID}`);
            currentDurationMinutes = savedDur ? parseInt(savedDur) : 20;
            const savedTime = localStorage.getItem(`time_${currentGameID}`);
            timeLeftSeconds = (savedTime !== null) ? parseInt(savedTime) : (currentDurationMinutes * 60);
            updateUI();
            updateHalfButton();
        }

        function saveAndRender() {
            localStorage.setItem(`laxEvents_${currentGameID}`, JSON.stringify(events));
            localStorage.setItem(`half_${currentGameID}`, currentHalf);
            localStorage.setItem(`dur_${currentGameID}`, currentDurationMinutes);
            localStorage.setItem(`time_${currentGameID}`, timeLeftSeconds);
            updateUI();
        }

        function formatTime(s) {
            const m = Math.floor(Math.max(0, s) / 60);
            const rs = Math.max(0, s) % 60;
            return `${m.toString().padStart(2, '0')}:${rs.toString().padStart(2, '0')}`;
        }

        function stopTimerEngine() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            const btn = document.getElementById('timer-toggle-btn');
            const display = document.getElementById('game-timer');
            btn.innerText = 'START';
            btn.classList.remove('pause');
            display.className = 'timer-paused';
        }

        function toggleTimer() {
            const btn = document.getElementById('timer-toggle-btn');
            const display = document.getElementById('game-timer');
            if (timerInterval) {
                stopTimerEngine();
                saveAndRender();
            } else {
                currentRunStartTime = Date.now();
                const baseTime = timeLeftSeconds;
                btn.innerText = 'PAUSE'; btn.classList.add('pause');
                display.className = 'timer-running';
                timerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - currentRunStartTime) / 1000);
                    timeLeftSeconds = Math.max(0, baseTime - elapsed);
                    display.innerText = formatTime(timeLeftSeconds);
                    if (timeLeftSeconds <= 0) stopTimerEngine();
                }, 200);
            }
        }

        function setTimerDuration() {
            const val = prompt("Minutes per half:", currentDurationMinutes);
            if (val && !isNaN(val)) {
                currentDurationMinutes = parseInt(val);
                timeLeftSeconds = currentDurationMinutes * 60;
                saveAndRender();
            }
        }

        function handleStatClick(type) {
            pendingStat.type = type;
            pendingStat.requiresNumber = STATS_REQUIRING_NUM.includes(type);
            document.getElementById('team-modal-overlay').style.display = "flex";
        }

        function selectTeam(team) {
            pendingStat.team = team;
            closeModal('team');
            const needsNum = (team === 'Our' && pendingStat.requiresNumber) || 
                            (team === 'Opponent' && ['Goal', 'Yellow Card', 'Save'].includes(pendingStat.type));
            if (needsNum) {
                currentNumber = "";
                document.getElementById('numpad-display').innerText = "_";
                document.getElementById('numpad-modal-overlay').style.display = "flex";
            } else {
                addEvent(pendingStat.type, team, null);
            }
        }

        function handleTOClick(team) {
            pendingStat.team = team;
            document.getElementById('to-modal-overlay').style.display = "flex";
        }

        function classifyTurnover(cl) {
            addEvent(cl === 'Forced' ? 'TO Forced' : 'TO Unforced', pendingStat.team, null);
            closeModal('to');
        }

        function addEvent(type, team, num) {
            const ev = {
                id: Date.now(),
                type: type, team: team, player: num,
                time: formatTime(timeLeftSeconds), half: currentHalf
            };
            events.unshift(ev);
            saveAndRender();
        }

        function deleteEvent(id) {
            if(confirm("Delete this entry?")) {
                events = events.filter(e => e.id !== id);
                saveAndRender();
            }
        }

        function clearAllData() {
            if(confirm("DANGER: This wipes everything for this game. Continue?")) {
                events = []; currentHalf = 1; timeLeftSeconds = currentDurationMinutes * 60;
                saveAndRender(); updateHalfButton();
            }
        }

        function switchHalf() {
            if (currentHalf === 1) {
                if(confirm("End H1?")) { stopTimerEngine(); currentHalf = 2; timeLeftSeconds = currentDurationMinutes * 60; }
            } else if (currentHalf === 2) {
                if(confirm("End Game?")) { stopTimerEngine(); currentHalf = 3; }
            } else {
                if(confirm("Reset Game Data?")) { events = []; currentHalf = 1; timeLeftSeconds = currentDurationMinutes * 60; }
            }
            updateHalfButton();
            saveAndRender();
        }

        function updateUI() {
            const count = (t, tm) => events.filter(e => e.type === t && e.team === tm).length;
            
            const ourG = count('Goal', 'Our'), oppG = count('Goal', 'Opponent');
            const ourM = count('Missed Shot', 'Our'), oppM = count('Missed Shot', 'Opponent');
            const ourS = count('Save', 'Opponent'), oppS = count('Save', 'Our');
            
            document.getElementById('score-our-goals').innerText = ourG;
            document.getElementById('score-opp-goals').innerText = oppG;
            document.getElementById('score-our-shots').innerText = ourG + ourM + oppS;
            document.getElementById('score-opp-shots').innerText = oppG + oppM + ourS;
            document.getElementById('score-our-saves').innerText = ourS;
            document.getElementById('score-opp-saves').innerText = oppS;
            document.getElementById('score-our-draws').innerText = count('Draw', 'Our');
            document.getElementById('score-opp-draws').innerText = count('Draw', 'Opponent');
            document.getElementById('score-our-to').innerText = events.filter(e => e.type.includes('TO') && e.team === 'Our').length;
            document.getElementById('score-opp-to').innerText = events.filter(e => e.type.includes('TO') && e.team === 'Opponent').length;
            document.getElementById('score-our-missed').innerText = ourM;
            document.getElementById('score-opp-missed').innerText = oppM;
            document.getElementById('game-timer').innerText = formatTime(timeLeftSeconds);

            const hist = document.getElementById('history-container');
            hist.innerHTML = events.map(e => `
                <div class="history-item">
                    <span class="${e.team === 'Our' ? 'team-our' : 'team-opp'}" style="font-size:12px; font-weight:bold;">${e.team}: ${e.type} ${e.player ? '#'+e.player : ''}</span>
                    <span>${e.time} <button onclick="deleteEvent(${e.id})" style="color:red; border:none; background:none; font-size:16px;">✕</button></span>
                </div>
            `).join('');

            updateTrackers();
        }

        function updateTrackers() {
            const getLeader = (team, type) => {
                const filtered = events.filter(e => e.type === type && e.team === team && e.player && e.player !== '?');
                const counts = {};
                filtered.forEach(item => counts[item.player] = (counts[item.player] || 0) + 1);
                let leader = {p: '--', c: 0};
                for(let p in counts) if(counts[p] > leader.c) leader = {p, c: counts[p]};
                return leader.c > 0 ? `#${leader.p} (${leader.c})` : '--';
            };

            const getCards = (team) => {
                const cards = events.filter(e => e.type === 'Yellow Card' && e.team === team && e.player).map(e => '#' + e.player);
                return cards.length > 0 ? cards.join(', ') : '--';
            };

            document.getElementById('our-top-scorer').innerText = getLeader('Our', 'Goal');
            document.getElementById('opp-top-scorer').innerText = getLeader('Opponent', 'Goal');
            document.getElementById('our-cards').innerText = getCards('Our');
            document.getElementById('opp-cards').innerText = getCards('Opponent');
        }

        function updateHalfButton() {
            const b = document.getElementById('half-tracker-btn');
            b.innerText = currentHalf === 1 ? "H1 / H2" : (currentHalf === 2 ? "H2 / END" : "NEW GAME");
        }

        function numInput(v) {
            if(v === '?') { addEvent(pendingStat.type, pendingStat.team, '?'); closeModal('numpad'); return; }
            if(currentNumber.length < 3) { currentNumber += v; document.getElementById('numpad-display').innerText = currentNumber; }
        }
        function submitNum() { if(currentNumber) { addEvent(pendingStat.type, pendingStat.team, currentNumber); closeModal('numpad'); } }
        function closeModal(m) { document.getElementById(m + '-modal-overlay').style.display = 'none'; }
        function handleNoteClick() { const n = prompt("Note:"); if(n) addEvent('Note', 'Game', n); }

        function exportResults() {
            const newStatSet = () => ({ 'Goal': 0, 'Assist': 0, 'Shot': 0, 'Missed Shot': 0, 'Save': 0, 'Draw': 0, 'Turnover': 0, 'Yellow Card': 0 });
            const summary = { 'Our': { 1: newStatSet(), 2: newStatSet(), 'Total': newStatSet() }, 'Opponent': { 1: newStatSet(), 2: newStatSet(), 'Total': newStatSet() } };
            const contributors = { 'Our': { 'Goal': [], 'Assist': [], 'Turnover': [], 'Yellow Card': [] }, 'Opponent': { 'Goal': [], 'Assist': [], 'Turnover': [], 'Yellow Card': [] } };
            const trackPlayer = ['Goal', 'Assist', 'Turnover', 'Yellow Card'];

            events.forEach(e => {
                if (e.team !== 'Our' && e.team !== 'Opponent') return;
                let cat = e.type;
                if (cat.includes('TO')) cat = 'Turnover';
                if (cat === 'Draw Ctrl') cat = 'Draw';
                const h = e.half; const team = e.team; const oppTeam = team === 'Our' ? 'Opponent' : 'Our';

                const inc = (t, c) => { if (summary[t][h]) summary[t][h][c]++; summary[t]['Total'][c]++; };

                if (trackPlayer.includes(cat) && e.player && e.player !== '?') contributors[team][cat].push(e.player);
                if (trackPlayer.includes(cat) || cat === 'Draw') inc(team, cat);
                if (cat === 'Goal') { inc(team, 'Goal'); inc(team, 'Shot'); }
                else if (cat === 'Missed Shot') { inc(team, 'Missed Shot'); inc(team, 'Shot'); }
                else if (cat === 'Save') { inc(team, 'Save'); inc(oppTeam, 'Shot'); }
            });

            let content = "GAME SUMMARY\nCategory\tOur (H1)\tOur (H2)\tOur (Total)\tOpp (H1)\tOpp (H2)\tOpp (Total)\tDifferential (+/-)\n";
            const rowKeys = ['Goal', 'Assist', 'Shot', 'Missed Shot', 'Save', 'Draw', 'Turnover', 'Yellow Card'];
            
            rowKeys.forEach(key => {
                const getTotalString = (tm) => {
                    let total = summary[tm]['Total'][key];
                    if (trackPlayer.includes(key) && contributors[tm][key].length > 0) {
                        const sorted = contributors[tm][key].sort((a,b) => parseInt(a) - parseInt(b));
                        return `${total} (#${sorted.join(', #')})`;
                    }
                    return total;
                };
                const diff = summary['Our']['Total'][key] - summary['Opponent']['Total'][key];
                const diffStr = diff > 0 ? `+${diff}` : diff;
                content += `${key}\t${summary['Our'][1][key]}\t${summary['Our'][2][key]}\t${getTotalString('Our')}\t${summary['Opponent'][1][key]}\t${summary['Opponent'][2][key]}\t${getTotalString('Opponent')}\t${diffStr}\n`;
            });

            content += "\nPLAY-BY-PLAY HISTORY\nHalf\tTime\tTeam\tStat\tPlayer\n";
            events.forEach(e => { content += `${e.half}\t${e.time}\t${e.team}\t${e.type}\t${e.player || ''}\n`; });

            const textArea = document.createElement("textarea");
            textArea.value = content;
            textArea.style.position = "fixed"; textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus(); textArea.select();
            textArea.setSelectionRange(0, 99999);
            let success = false;
            try { success = document.execCommand('copy'); } catch (err) {}
            document.body.removeChild(textArea);

            const blob = new Blob([content], { type: 'text/tab-separated-values' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `${currentGameID}_Summary.tsv`; a.click();
            alert(success ? "Data Copied & Downloaded!" : "File Downloaded.");
        }
    </script>
</body>
</html>
