<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LaxTracker Multi-Game</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --our-team-color: #34c759;
            --opponent-color: #ff3b30;
            --blue: #007aff;
            --orange: #ff9500;
            --purple: #af52de;
            --yellow: #ffcc00;
            --teal: #30b0c7;
            --card-color: #ffcc00;
            --save-color: #00aaff;
            --to-color: #ff6347;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
        }

        /* NEW: Game Selector Header */
        #game-setup-header {
            background-color: #1c1c1e;
            color: white;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #game-id-input {
            background: #2c2c2e;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
        }

        #scoreboard {
            background-color: var(--card-bg);
            padding: 2px 5px; 
            border-bottom: 1px solid #ccc;
            flex-shrink: 0;
        }

        .score-row {
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 2px; 
            margin-bottom: 2px; 
        }

        .score-item { 
            text-align: center; 
            padding: 2px 0; 
            border-right: 1px solid #eee; 
        }
        .score-item:last-child { border-right: none; }

        .score-val { font-size: 15px; font-weight: bold; line-height: 1.1; }
        .score-label { font-size: 7px; color: #666; font-weight: bold; text-transform: uppercase; }
        .team-our { color: var(--our-team-color); }
        .team-opp { color: var(--opponent-color); }
        
        #main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 5px 8px; 
            padding-bottom: 60px; 
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
        .grid-extended { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 6px; }

        button.stat-btn {
            border: none; color: white; padding: 12px; font-size: 14px; font-weight: 800;
            border-radius: 8px; cursor: pointer; text-transform: uppercase; touch-action: manipulation;
        }
        
        button.stat-btn:active { opacity: 0.7; transform: scale(0.98); }

        .btn-goal { background-color: var(--our-team-color); }
        .btn-missed { background-color: var(--blue); } 
        .btn-assist { background-color: var(--teal); }
        .btn-draw { background-color: var(--purple); }
        .btn-to-our { background-color: #ff6347; }
        .btn-to-opp { background-color: #cc3333; }
        .btn-save { background-color: var(--save-color); }
        .btn-card { background-color: var(--card-color); color: #333 !important; } 
        .btn-note { background-color: #8e8e93; } 

        #timer-container {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--card-bg); padding: 8px; border-radius: 8px; margin-bottom: 6px;
        }

        #game-timer { font-size: 22px; font-weight: 900; color: var(--opponent-color); }
        
        #history-container {
            background-color: var(--card-bg); border-top: 1px solid #ccc;
            height: 20%; overflow-y: auto; flex-shrink: 0;
        }

        .history-item {
            padding: 8px 12px; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: flex-end; z-index: 100;
        }
        
        .modal-content {
            background: white; width: 100%; border-radius: 20px 20px 0 0;
            padding: 20px; box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
        }

        .numpad-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .num-btn { background: #e5e5ea; border: none; padding: 15px; font-size: 24px; border-radius: 10px; }
        .num-btn.ok { background-color: var(--our-team-color); color: white; }
    </style>
</head>
<body>

    <div id="game-setup-header">
        <label style="font-size: 10px; font-weight: bold;">ACTIVE GAME NAME:</label>
        <input type="text" id="game-id-input" placeholder="e.g. Game-1" onchange="switchGameContext()">
    </div>

    <div id="scoreboard">
        <div class="score-row">
            <div class="score-item">
                <span class="score-val"><span class="team-our" id="score-our-goals">0</span> / <span class="team-opp" id="score-opp-goals">0</span></span>
                <span class="score-label">Goals</span>
            </div>
            <div class="score-item">
                <span class="score-val"><span class="team-our" id="score-our-draws">0</span> / <span class="team-opp" id="score-opp-draws">0</span></span>
                <span class="score-label">Draws</span>
            </div>
            <div class="score-item">
                <span class="score-val"><span class="team-our" id="score-our-to">0</span> / <span class="team-opp" id="score-opp-to">0</span></span>
                <span class="score-label">TOs</span>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="grid">
            <button class="stat-btn btn-goal" onclick="handleStatClick('Goal')">Goal</button>
            <button class="stat-btn btn-missed" onclick="handleStatClick('Missed Shot')">Missed</button>
            <button class="stat-btn btn-assist" onclick="handleStatClick('Assist')">Assist</button>
            <button class="stat-btn btn-save" onclick="handleStatClick('Save')">Save</button>
        </div>
        
        <div class="grid">
            <button class="stat-btn btn-to-our" onclick="handleTOClick('Our')">Our TO</button>
            <button class="stat-btn btn-to-opp" onclick="handleTOClick('Opponent')">Opp TO</button>
        </div>

        <div class="grid-extended">
            <button class="stat-btn btn-draw" onclick="handleStatClick('Draw')">Draw</button>
            <button class="stat-btn btn-card" onclick="handleStatClick('Yellow Card')">Card</button>
            <button class="stat-btn btn-note" onclick="handleNoteClick()">Note</button>
        </div>

        <div id="timer-container">
            <div>
                <span class="score-label" style="display:block;">CLOCK</span>
                <div id="game-timer">20:00</div>
            </div>
            <div id="timer-controls">
                <button id="timer-toggle-btn" style="padding:10px; border-radius:5px; background:var(--our-team-color); color:white; border:none;" onclick="toggleTimer()">START</button>
                <button id="half-tracker-btn" style="padding:10px; border-radius:5px; background:var(--purple); color:white; border:none;" onclick="switchHalf()">H1</button>
            </div>
        </div>
        
        <button class="stat-btn btn-utility" style="background-color: var(--teal); width: 100%;" onclick="exportResults()">Export CSV</button>
    </div>

    <div id="history-container"></div>

    <div id="team-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div id="team-modal-title" style="text-align:center; font-weight:bold; margin-bottom:15px;">Who earned the stat?</div>
            <div class="grid">
                <button class="stat-btn btn-goal" onclick="selectTeam('Our')">Our Team</button>
                <button class="stat-btn btn-to-opp" onclick="selectTeam('Opponent')">Opponent</button>
            </div>
            <button onclick="closeModal('team')" style="width:100%; padding:10px; border:none; background:none; color:var(--blue);">Cancel</button>
        </div>
    </div>

    <div id="numpad-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div id="numpad-title" style="text-align:center; color:#666; margin-bottom:10px;">Enter Player #</div>
            <div id="numpad-display" style="font-size:40px; text-align:center; margin-bottom:15px; font-weight:bold; border-bottom:1px solid #ddd;">_</div>
            <div class="numpad-grid">
                <button class="num-btn" onclick="numInput('1')">1</button><button class="num-btn" onclick="numInput('2')">2</button><button class="num-btn" onclick="numInput('3')">3</button>
                <button class="num-btn" onclick="numInput('4')">4</button><button class="num-btn" onclick="numInput('5')">5</button><button class="num-btn" onclick="numInput('6')">6</button>
                <button class="num-btn" onclick="numInput('7')">7</button><button class="num-btn" onclick="numInput('8')">8</button><button class="num-btn" onclick="numInput('9')">9</button>
                <button class="num-btn" onclick="numInput('?')">?</button><button class="num-btn" onclick="numInput('0')">0</button>
                <button class="num-btn ok" onclick="submitNum()">OK</button>
            </div>
        </div>
    </div>

    <script>
        let currentGameID = "DefaultGame";
        let events = [];
        let currentHalf = 1;
        let timeLeftSeconds = 1200;
        let timerInterval = null;
        let pendingStat = { type: null, team: null, requiresNumber: false };
        let currentNumber = "";

        // --- CORE MULTI-GAME LOGIC ---
        window.onload = function() {
            // Check if there was a last-used game ID
            const lastID = localStorage.getItem('lastActiveGameID');
            if (lastID) {
                currentGameID = lastID;
                document.getElementById('game-id-input').value = currentGameID;
            }
            loadGameData();
        };

        function switchGameContext() {
            const newID = document.getElementById('game-id-input').value.trim();
            if (!newID) return;
            
            // Stop current timer before switching
            if (timerInterval) toggleTimer();
            
            currentGameID = newID;
            localStorage.setItem('lastActiveGameID', currentGameID);
            loadGameData();
        }

        function loadGameData() {
            const savedEvents = localStorage.getItem(`laxEvents_${currentGameID}`);
            events = savedEvents ? JSON.parse(savedEvents) : [];
            
            const savedHalf = localStorage.getItem(`half_${currentGameID}`);
            currentHalf = savedHalf ? parseInt(savedHalf) : 1;
            
            const savedTime = localStorage.getItem(`time_${currentGameID}`);
            timeLeftSeconds = savedTime ? parseInt(savedTime) : 1200;
            
            document.getElementById('game-timer').innerText = formatTime(timeLeftSeconds);
            updateUI();
            updateHalfButton();
        }

        function saveGameData() {
            localStorage.setItem(`laxEvents_${currentGameID}`, JSON.stringify(events));
            localStorage.setItem(`half_${currentGameID}`, currentHalf);
            localStorage.setItem(`time_${currentGameID}`, timeLeftSeconds);
            updateUI();
        }

        // --- CLOCK LOGIC ---
        function formatTime(s) {
            const m = Math.floor(s / 60);
            const rs = s % 60;
            return `${m.toString().padStart(2,'0')}:${rs.toString().padStart(2,'0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('timer-toggle-btn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = "START";
                btn.style.background = "var(--our-team-color)";
            } else {
                timerInterval = setInterval(() => {
                    if (timeLeftSeconds > 0) {
                        timeLeftSeconds--;
                        document.getElementById('game-timer').innerText = formatTime(timeLeftSeconds);
                        if (timeLeftSeconds % 5 === 0) saveGameData(); // Auto-save every 5 seconds
                    } else {
                        toggleTimer();
                        alert("Time Expired!");
                    }
                }, 1000);
                btn.innerText = "PAUSE";
                btn.style.background = "var(--orange)";
            }
        }

        // --- STAT LOGIC ---
        function handleStatClick(type) {
            pendingStat.type = type;
            pendingStat.requiresNumber = ['Goal', 'Missed Shot', 'Assist', 'Yellow Card', 'Save'].includes(type);
            document.getElementById('team-modal-overlay').style.display = "flex";
        }

        function selectTeam(team) {
            pendingStat.team = team;
            document.getElementById('team-modal-overlay').style.display = "none";
            if (pendingStat.requiresNumber) {
                currentNumber = "";
                document.getElementById('numpad-display').innerText = "_";
                document.getElementById('numpad-modal-overlay').style.display = "flex";
            } else {
                addEvent(pendingStat.type, team, null);
            }
        }

        function numInput(val) {
            if (val === '?') { submitNum('?'); return; }
            if (currentNumber.length < 2) {
                currentNumber += val;
                document.getElementById('numpad-display').innerText = currentNumber;
            }
        }

        function submitNum(override = null) {
            const num = override || currentNumber;
            if (num !== "") {
                addEvent(pendingStat.type, pendingStat.team, num);
                document.getElementById('numpad-modal-overlay').style.display = "none";
            }
        }

        function addEvent(type, team, player) {
            const ev = {
                id: Date.now(),
                type, team, player,
                time: formatTime(timeLeftSeconds),
                half: currentHalf
            };
            events.unshift(ev);
            saveGameData();
        }

        function updateUI() {
            const count = (t, team) => events.filter(e => e.type === t && e.team === team).length;
            document.getElementById('score-our-goals').innerText = count('Goal', 'Our');
            document.getElementById('score-opp-goals').innerText = count('Goal', 'Opponent');
            document.getElementById('score-our-draws').innerText = count('Draw', 'Our');
            document.getElementById('score-opp-draws').innerText = count('Draw', 'Opponent');
            
            const list = document.getElementById('history-container');
            list.innerHTML = events.map(e => `
                <div class="history-item">
                    <span style="color:${e.team === 'Our' ? 'var(--our-team-color)' : 'var(--opponent-color)'}">
                        ${e.team === 'Our' ? 'OUR' : 'OPP'} ${e.type} ${e.player ? '#' + e.player : ''}
                    </span>
                    <span style="font-size:10px; color:#999;">H${e.half} @ ${e.time}</span>
                </div>
            `).join('');
        }

        function switchHalf() {
            if (currentHalf === 1) {
                if (confirm("End H1?")) { currentHalf = 2; timeLeftSeconds = 1200; saveGameData(); }
            } else {
                if (confirm("Reset Game?")) { 
                    if (confirm("This clears ALL stats for " + currentGameID)) {
                        events = []; currentHalf = 1; timeLeftSeconds = 1200; saveGameData();
                    }
                }
            }
            updateHalfButton();
        }

        function updateHalfButton() {
            document.getElementById('half-tracker-btn').innerText = currentHalf === 1 ? "H1" : "H2";
        }

        function closeModal(m) { document.getElementById(m + '-modal-overlay').style.display = "none"; }

        function handleTOClick(team) { addEvent('Turnover', team, null); }
        function handleNoteClick() { 
            const n = prompt("Note:"); 
            if(n) addEvent('Note', 'Game', n); 
        }

        function exportResults() {
            let csv = "Game,Half,Time,Team,Stat,Player\n";
            events.forEach(e => {
                csv += `${currentGameID},${e.half},${e.time},${e.team},${e.type},${e.player || ''}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `${currentGameID}_Stats.csv`);
            a.click();
        }
    </script>
</body>
</html>
