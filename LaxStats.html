<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LaxTracker Multi-Game (Clock Fix)</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --our-team-color: #34c759;
            --opponent-color: #ff3b30;
            --blue: #007aff;
            --orange: #ff9500;
            --purple: #af52de;
            --teal: #30b0c7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
        }

        #game-setup-header {
            background-color: #1c1c1e;
            color: white;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #game-id-input {
            background: #2c2c2e;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
        }

        #scoreboard {
            background-color: var(--card-bg);
            padding: 5px; 
            border-bottom: 1px solid #ccc;
            flex-shrink: 0;
        }

        .score-row {
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 5px; 
        }

        .score-item { text-align: center; border-right: 1px solid #eee; }
        .score-item:last-child { border-right: none; }
        .score-val { font-size: 18px; font-weight: bold; }
        .score-label { font-size: 10px; color: #666; font-weight: bold; text-transform: uppercase; }

        #main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 8px; 
            padding-bottom: 60px; 
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

        button.stat-btn {
            border: none; color: white; padding: 15px; font-size: 14px; font-weight: 800;
            border-radius: 8px; cursor: pointer; text-transform: uppercase;
        }

        #timer-container {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--card-bg); padding: 12px; border-radius: 8px; margin-bottom: 8px;
        }

        #game-timer { font-size: 24px; font-weight: 900; color: var(--opponent-color); }
        
        #history-container {
            background-color: var(--card-bg); border-top: 1px solid #ccc;
            height: 20%; overflow-y: auto;
        }

        .history-item {
            padding: 8px 12px; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: flex-end; z-index: 100;
        }
        
        .modal-content {
            background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px;
        }

        .numpad-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .num-btn { background: #e5e5ea; border: none; padding: 15px; font-size: 24px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="game-setup-header">
        <label style="font-size: 10px; font-weight: bold;">ACTIVE GAME NAME:</label>
        <input type="text" id="game-id-input" placeholder="e.g. Game-1" onchange="switchGameContext()">
    </div>

    <div id="scoreboard">
        <div class="score-row">
            <div class="score-item"><div class="score-val"><span style="color:var(--our-team-color)" id="score-our-goals">0</span> / <span style="color:var(--opponent-color)" id="score-opp-goals">0</span></div><div class="score-label">Goals</div></div>
            <div class="score-item"><div class="score-val" id="score-our-draws">0</div><div class="score-label">Draws</div></div>
            <div class="score-item"><div class="score-val" id="score-our-to">0</div><div class="score-label">TOs</div></div>
        </div>
    </div>

    <div id="main-content">
        <div class="grid">
            <button class="stat-btn" style="background:var(--our-team-color)" onclick="handleStatClick('Goal')">Goal</button>
            <button class="stat-btn" style="background:var(--blue)" onclick="handleStatClick('Missed')">Missed</button>
            <button class="stat-btn" style="background:var(--teal)" onclick="handleStatClick('Assist')">Assist</button>
            <button class="stat-btn" style="background:var(--purple)" onclick="handleStatClick('Save')">Save</button>
        </div>

        <div id="timer-container">
            <div>
                <span class="score-label">CLOCK</span>
                <div id="game-timer">20:00</div>
            </div>
            <div style="display: flex; gap: 5px;">
                <button onclick="toggleTimer()" id="timer-toggle-btn" style="padding:10px; background:var(--our-team-color); color:white; border:none; border-radius:5px;">START</button>
                <button onclick="setNewDuration()" style="padding:10px; background:var(--teal); color:white; border:none; border-radius:5px;">SET</button>
                <button onclick="switchHalf()" id="half-btn" style="padding:10px; background:var(--purple); color:white; border:none; border-radius:5px;">H1</button>
            </div>
        </div>

        <div class="grid">
            <button class="stat-btn" style="background:var(--orange)" onclick="addEvent('TO', 'Our', null)">Our TO</button>
            <button class="stat-btn" style="background:var(--opponent-color)" onclick="addEvent('TO', 'Opponent', null)">Opp TO</button>
        </div>

        <button class="stat-btn" style="background:#555; width:100%; margin-top:10px;" onclick="exportResults()">Export CSV</button>
    </div>

    <div id="history-container"></div>

    <div id="team-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div style="text-align:center; margin-bottom:15px; font-weight:bold;">Which Team?</div>
            <div class="grid">
                <button class="stat-btn" style="background:var(--our-team-color)" onclick="selectTeam('Our')">Our Team</button>
                <button class="stat-btn" style="background:var(--opponent-color)" onclick="selectTeam('Opponent')">Opponent</button>
            </div>
            <button onclick="closeModal('team')" style="width:100%; padding:10px; border:none; background:none; color:var(--blue);">Cancel</button>
        </div>
    </div>

    <div id="numpad-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div id="numpad-display" style="font-size:40px; text-align:center; margin-bottom:15px; font-weight:bold;">_</div>
            <div class="numpad-grid">
                <button class="num-btn" onclick="numInput('1')">1</button><button class="num-btn" onclick="numInput('2')">2</button><button class="num-btn" onclick="numInput('3')">3</button>
                <button class="num-btn" onclick="numInput('4')">4</button><button class="num-btn" onclick="numInput('5')">5</button><button class="num-btn" onclick="numInput('6')">6</button>
                <button class="num-btn" onclick="numInput('7')">7</button><button class="num-btn" onclick="numInput('8')">8</button><button class="num-btn" onclick="numInput('9')">9</button>
                <button class="num-btn" onclick="numInput('?')">?</button><button class="num-btn" onclick="numInput('0')">0</button>
                <button class="num-btn" style="background:var(--our-team-color); color:white;" onclick="submitNum()">OK</button>
            </div>
        </div>
    </div>

    <script>
        let currentGameID = "DefaultGame";
        let events = [];
        let currentHalf = 1;
        let timeLeftSeconds = 1200; 
        let timerInterval = null;
        let pendingStat = { type: null, team: null };
        let currentNumber = "";

        window.onload = function() {
            const lastID = localStorage.getItem('lastActiveGameID');
            if (lastID) {
                currentGameID = lastID;
                document.getElementById('game-id-input').value = currentGameID;
            }
            loadGameData();
        };

        function switchGameContext() {
            const newID = document.getElementById('game-id-input').value.trim();
            if (!newID) return;
            if (timerInterval) toggleTimer();
            currentGameID = newID;
            localStorage.setItem('lastActiveGameID', currentGameID);
            loadGameData();
        }

        function loadGameData() {
            const savedEvents = localStorage.getItem(`laxEvents_${currentGameID}`);
            events = savedEvents ? JSON.parse(savedEvents) : [];
            const savedHalf = localStorage.getItem(`half_${currentGameID}`);
            currentHalf = savedHalf ? parseInt(savedHalf) : 1;
            const savedTime = localStorage.getItem(`time_${currentGameID}`);
            timeLeftSeconds = savedTime ? parseInt(savedTime) : 1200;
            
            document.getElementById('game-timer').innerText = formatTime(timeLeftSeconds);
            updateUI();
        }

        function saveGameData() {
            localStorage.setItem(`laxEvents_${currentGameID}`, JSON.stringify(events));
            localStorage.setItem(`half_${currentGameID}`, currentHalf);
            localStorage.setItem(`time_${currentGameID}`, timeLeftSeconds);
            updateUI();
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const rs = s % 60;
            return `${m.toString().padStart(2,'0')}:${rs.toString().padStart(2,'0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('timer-toggle-btn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = "START";
                btn.style.background = "var(--our-team-color)";
            } else {
                timerInterval = setInterval(() => {
                    if (timeLeftSeconds > 0) {
                        timeLeftSeconds--;
                        document.getElementById('game-timer').innerText = formatTime(timeLeftSeconds);
                        if (timeLeftSeconds % 10 === 0) saveGameData();
                    } else {
                        toggleTimer();
                        alert("Time's up!");
                    }
                }, 1000);
                btn.innerText = "PAUSE";
                btn.style.background = "var(--orange)";
            }
        }

        function setNewDuration() {
            const mins = prompt("Enter game duration in minutes:", Math.floor(timeLeftSeconds / 60));
            if (mins && !isNaN(mins)) {
                timeLeftSeconds = parseInt(mins) * 60;
                document.getElementById('game-timer').innerText = formatTime(timeLeftSeconds);
                saveGameData();
            }
        }

        function handleStatClick(type) {
            pendingStat.type = type;
            document.getElementById('team-modal-overlay').style.display = "flex";
        }

        function selectTeam(team) {
            pendingStat.team = team;
            closeModal('team');
            currentNumber = "";
            document.getElementById('numpad-display').innerText = "_";
            document.getElementById('numpad-modal-overlay').style.display = "flex";
        }

        function numInput(val) {
            if (val === '?') { currentNumber = '?'; submitNum(); return; }
            if (currentNumber.length < 2) {
                currentNumber += val;
                document.getElementById('numpad-display').innerText = currentNumber;
            }
        }

        function submitNum() {
            addEvent(pendingStat.type, pendingStat.team, currentNumber);
            document.getElementById('numpad-modal-overlay').style.display = "none";
        }

        function addEvent(type, team, player) {
            events.unshift({ id: Date.now(), type, team, player, time: formatTime(timeLeftSeconds), half: currentHalf });
            saveGameData();
        }

        function updateUI() {
            document.getElementById('score-our-goals').innerText = events.filter(e => e.type === 'Goal' && e.team === 'Our').length;
            document.getElementById('score-opp-goals').innerText = events.filter(e => e.type === 'Goal' && e.team === 'Opponent').length;
            document.getElementById('score-our-draws').innerText = events.filter(e => e.type === 'Draw' && e.team === 'Our').length;
            document.getElementById('score-our-to').innerText = events.filter(e => e.type === 'TO' && e.team === 'Our').length;
            
            document.getElementById('history-container').innerHTML = events.map(e => `
                <div class="history-item">
                    <span>${e.team === 'Our' ? 'OUR' : 'OPP'} ${e.type} #${e.player || ''}</span>
                    <span style="font-size:10px; color:#999;">${e.time}</span>
                </div>
            `).join('');
            document.getElementById('half-btn').innerText = 'H' + currentHalf;
        }

        function switchHalf() {
            if (confirm("Switch half?")) {
                currentHalf = currentHalf === 1 ? 2 : 1;
                saveGameData();
            }
        }

        function closeModal(m) { document.getElementById(m + '-modal-overlay').style.display = "none"; }

        function exportResults() {
            let csv = "Game,Half,Time,Team,Stat,Player\n";
            events.forEach(e => csv += `${currentGameID},${e.half},${e.time},${e.team},${e.type},${e.player || ''}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${currentGameID}_stats.csv`;
            a.click();
        }
    </script>
</body>
</html>
